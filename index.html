<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F23;--gold:#F5C84B;--muted:#9aa3d6}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 50% 30%,#26358a 0%,var(--bg) 70%);color:#fff;font-family:Figtree,system-ui,sans-serif;display:grid;place-items:center;text-align:center;padding:24px;overflow:hidden}
h1{font-family:Unbounded,system-ui,sans-serif;font-weight:900;font-size:clamp(40px,10vw,120px);line-height:1;background:linear-gradient(180deg,#FFF1BE,var(--gold) 55%,#d99b1e);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop 1s cubic-bezier(.2,1.5,.4,1) both}
p{color:var(--muted);font-size:clamp(16px,2.4vw,22px);margin-top:18px;animation:fade 1s .6s both}
.b{position:fixed;bottom:-120px;width:60px;height:76px;border-radius:50% 50% 48% 48%;opacity:.85;animation:up linear infinite}
.b::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:60px;background:rgba(255,255,255,.35)}
@keyframes up{to{transform:translateY(-130vh)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<main><h1>Happy<br>Birthday!</h1><p>🎈 Something fun is on its way. Grab a controller.</p></main>
<script>
const C=['#F5C84B','#f0456e','#3fb6f0','#7b6cf0','#4be0a8'];
for(let i=0;i<14;i++){const b=document.createElement('div');b.className='b';b.style.left=(Math.random()*95)+'vw';b.style.background=C[i%C.length];b.style.animationDuration=(8+Math.random()*8)+'s';b.style.animationDelay=(-Math.random()*14)+'s';document.body.appendChild(b);}
</script>
</body>
</html>
